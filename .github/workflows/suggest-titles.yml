name: Suggest Zendesk Ticket Titles

on:
  workflow_dispatch:
    inputs:
      max_tickets:
        description: "Maximum number of tickets to scan"
        required: false
        default: "50"
        type: string

jobs:
  suggest-titles:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ticket title suggester
        env:
          ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_TICKETS: ${{ inputs.max_tickets }}
          OUTPUT_FILE: title_suggestions.csv
        run: python ticket_title_suggester.py

      - name: Upload suggestions report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: title-suggestions-report-${{ github.run_id }}
          path: title_suggestions.csv
          retention-days: 30

      - name: Upload CSV to Google Drive
        if: success() && hashFiles('title_suggestions.csv') != ''
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_CREDENTIALS_JSON" ] || [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "Google Drive secrets not configured - skipping upload"
            echo "To enable, add GDRIVE_CREDENTIALS_JSON and GDRIVE_FOLDER_ID secrets"
          else
            python upload_to_drive.py title_suggestions.csv
          fi
