name: Suggest Zendesk Ticket Titles

on:
  workflow_dispatch:
    inputs:
      max_tickets:
        description: "Maximum number of tickets to scan"
        required: false
        default: "50"
        type: string
      zendesk_group:
        description: "Zendesk group to filter tickets (default: IT-Operations)"
        required: false
        default: "IT-Operations"
        type: string

jobs:
  suggest-titles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ticket title suggester
        env:
          ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_KEY }}
          MAX_TICKETS: ${{ inputs.max_tickets }}
          ZENDESK_GROUP: ${{ inputs.zendesk_group }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python ticket_title_suggester.py

      - name: Upload suggestions report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: title-suggestions-report-${{ github.run_id }}
          path: /tmp/Title_Suggestions_*.xlsx
          retention-days: 30
